<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linear Structures - DSA Playground</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('dsa-theme');
        document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/visualizer.css">
  <style>
    /* Specific styles for Stack & Queue containers */
    .stack-display {
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 6px;
      width: 140px;
      min-height: 280px;
      border: 3px solid var(--accent);
      border-top: none;
      padding: 10px;
      border-radius: 0 0 12px 12px;
    }

    .queue-display {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      min-width: 300px;
      height: 80px;
      border: 3px solid var(--accent);
      border-left: none;
      border-right: none;
      padding: 10px;
    }

    .struct-node {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 40px;
      transition: all 0.3s ease;
    }

    .queue-display .struct-node {
      width: 50px;
      height: 50px;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a class="logo" href="../index.html">
      <img src="../favicon.svg" alt="DSA Playground" class="logo-favicon">
      <span class="logo-text">DSA Playground</span>
    </a>
    <div class="nav-right">
      <ul class="nav-links">
        <li><a href="../index.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg></span> Dashboard</a></li>
        <li><a href="linear-structures.html" class="active"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="4" rx="1"/><rect x="4" y="10.5" width="16" height="4" rx="1"/><rect x="4" y="16" width="16" height="4" rx="1"/></svg></span> Linear</a></li>
        <li><a href="sorting.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><line x1="6" y1="21" x2="6" y2="12"/><line x1="12" y1="21" x2="12" y2="4"/><line x1="18" y1="21" x2="18" y2="9"/></svg></span> Sorting</a></li>
        <li><a href="searching.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.2" y1="16.2" x2="21" y2="21"/></svg></span> Searching</a></li>
        <li><a href="tree.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M12 7.5 6.9 16.7M12 7.5l5.1 9.2"/></svg></span> Trees</a></li>
        <li><a href="graph.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.2 8.2l3.6 7.6M15.8 8.2l-3.6 7.6M8.5 7h7"/></svg></span> Graphs</a></li>
      </ul>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme">
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.2" y1="4.2" x2="6" y2="6"/><line x1="18" y1="18" x2="19.8" y2="19.8"/><line x1="4.2" y1="19.8" x2="6" y2="18"/><line x1="18" y1="6" x2="19.8" y2="4.2"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </div>
  </nav>

  <div class="visualizer-container">
    <h2>Stack &amp; Queue Visualizer</h2>

    <!-- Controls Panel -->
    <div class="control-panel">
      <div class="input-group">
        <select id="struct-select" class="btn btn-secondary">
          <option value="stack">Stack (LIFO)</option>
          <option value="queue">Queue (FIFO)</option>
        </select>
        <input type="text" id="node-input" placeholder="Enter Value" style="width: 120px;">
      </div>

      <div class="input-group">
        <button id="push-btn" class="btn">PUSH / Enqueue</button>
        <button id="pop-btn" class="btn btn-secondary">POP / Dequeue</button>
        <button id="clear-btn" class="btn btn-secondary">Clear</button>
      </div>
    </div>

    <!-- Visualizer Canvas -->
    <div id="canvas-container" class="canvas-area" style="align-items: center;">
      <div id="display-area" class="stack-display"></div>
    </div>
  </div>

  <script src="../js/visualization/linearVisualizer.js"></script>
  <script src="../js/theme.js"></script>
</body>
</html>
