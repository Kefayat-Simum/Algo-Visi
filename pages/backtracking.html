<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N-Queens Visualizer - DSA Playground</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/visualizer.css">
  <style>
    .chessboard {
      display: grid;
      grid-template-columns: repeat(4, 60px);
      grid-template-rows: repeat(4, 60px);
      border: 3px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
    }
    .cell {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      transition: background-color 0.2s ease;
    }
    .cell.light {
      background-color: #f0d9b5;
    }
    .cell.dark {
      background-color: #b58863;
    }
    .cell.testing {
      background-color: #f59e0b !important; /* Amber for conflict check */
    }
    .cell.conflict {
      background-color: #ef4444 !important; /* Red for invalid placement */
    }
    .cell.queen {
      background-color: #10b981 !important; /* Green for valid placement */
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="logo">
      <span class="logo-icon">&lt;/&gt;</span>
      <span class="logo-text">DSA Playground</span>
    </div>
    <ul class="nav-links">
      <li><a href="../index.html">Dashboard</a></li>
      <li><a href="linear-structures.html">Linear Structures</a></li>
      <li><a href="sorting.html">Sorting</a></li>
      <li><a href="searching.html">Searching</a></li>
      <li><a href="tree.html">Trees</a></li>
      <li><a href="graph.html">Graphs</a></li>
      <li><a href="backtracking.html" class="active">Backtracking</a></li>
    </ul>
  </nav>

  <div class="visualizer-container">
    <h2>N-Queens Backtracking Visualizer (4x4 Grid)</h2>

    <!-- Controls Panel -->
    <div class="control-panel">
      <div class="input-group">
        <label for="speed-slider" style="font-size: 0.85rem; color: var(--text-muted);">Speed:</label>
        <input type="range" id="speed-slider" min="10" max="1000" value="500">
      </div>

      <div class="input-group">
        <button id="play-btn" class="btn">Start Backtracking</button>
        <button id="pause-btn" class="btn btn-secondary">Pause</button>
        <button id="reset-btn" class="btn btn-secondary">Reset</button>
      </div>
    </div>

    <!-- Visualizer Canvas -->
    <div id="canvas-container" class="canvas-area" style="align-items: center;">
      <div id="board" class="chessboard"></div>
    </div>

    <!-- Status Panel -->
    <div class="complexity-panel">
      <div class="complexity-card" style="grid-column: 1 / -1; text-align: left;">
        <span>Current Action:</span>
        <strong id="status-output" style="font-size: 1.1rem; color: var(--accent);">Ready to start</strong>
      </div>
    </div>
  </div>

  <script type="module" src="../js/visualization/boardVisualizer.js"></script>
</body>
</html>
